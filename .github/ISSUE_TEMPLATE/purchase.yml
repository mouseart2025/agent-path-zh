name: 购买登记（Offer-A ¥9.9）
description: 已扫码付款 ¥9.9，登记并领取「单元自测卡 + 1 次诊断」
title: "购买登记："
labels: ["purchase"]
body:
  - type: markdown
    attributes:
      value: |
        感谢支持！填下面三项，48h 内发放诊断回执。
        7 天内觉得不值，小报童留言原路退，不用解释理由。
        （购买渠道：小报童 https://xiaobot.net/p/agentpathcards ）
  - type: checkboxes
    id: paid
    attributes:
      label: 付款确认
      options:
        - label: 我已在小报童购买专栏（¥10）
          required: true
  - type: input
    id: contact
    attributes:
      label: 小报童昵称或订单号
      description: 用于核对订单（也可填邮箱便于联系）
      placeholder: 例：直接 Issue 回复 / you@example.com
  - type: textarea
    id: note
    attributes:
      label: 备注（可选）
      description: 你的背景/想解决的问题，诊断会更有针对性
